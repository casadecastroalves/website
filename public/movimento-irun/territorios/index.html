<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="description" content="Mapa Identidade e Território — Movimento Irun. Territórios de Identidade da Bahia e mapeamento participativo da REDE.">
  <link rel="canonical" href="https://casadecastroalves.com.br/movimento-irun/territorios/">
  <meta property="og:site_name" content="MOVIMENTO IRUN">
  <meta property="og:title" content="MOVIMENTO IRUN — Identidade e Território">
  <meta property="og:description" content="Mapa territorial interativo da Bahia — Territórios de Identidade e REDE Movimento Irun.">
  <meta property="og:type" content="website">
  <meta property="og:locale" content="pt_BR">
  <meta property="og:image" content="https://casadecastroalves.com.br/movimento-irun/territorios/assets/og-mapa-bahia.png">
  <meta name="twitter:card" content="summary_large_image">
  <title>MOVIMENTO IRUN — Identidade e Território</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Jost:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <div id="app">
    <aside id="sidebar" class="sidebar" aria-label="Painel de conteúdo">
      <div class="sheet-handle" id="sheet-handle" aria-hidden="true"><span class="handle-bar"></span></div>
      <header class="sidebar-header">
        <button type="button" id="btn-close-sidebar" class="btn-icon" aria-label="Fechar painel">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M18 6L6 18M6 6l12 12"/></svg>
        </button>
        <div class="brand sidebar-brand" data-home role="button" tabindex="0" aria-label="Início — mapa da Bahia e Sobre o Mapa" title="Início — mapa da Bahia">
          <span class="brand-title" id="brand-title">MOVIMENTO IRUN</span>
          <span class="brand-sub" id="brand-sub">IDENTIDADE E TERRITÓRIO</span>
        </div>
        <button type="button" class="btn-icon" data-open-search aria-label="Pesquisar no mapa">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"/><line x1="16.5" y1="16.5" x2="21" y2="21"/></svg>
        </button>
      </header>
      <div id="sidebar-content" class="sidebar-content" role="region" aria-label="Conteúdo territorial"></div>
      <footer class="sidebar-footer">
        <p id="footer-text"></p>
      </footer>
    </aside>

    <main class="map-area">
      <header id="topbar" class="topbar">
        <button type="button" id="btn-menu" class="btn-menu" aria-label="Abrir menu" aria-expanded="false" aria-controls="sidebar">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
        </button>
        <div class="topbar-brand" data-home role="button" tabindex="0" aria-label="Início — mapa da Bahia e Sobre o Mapa" title="Início — mapa da Bahia">
          <span class="brand-title">MOVIMENTO IRUN</span>
          <span class="brand-sub">IDENTIDADE E TERRITÓRIO</span>
        </div>
        <button type="button" class="btn-icon" data-open-search aria-label="Pesquisar no mapa">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"/><line x1="16.5" y1="16.5" x2="21" y2="21"/></svg>
        </button>
      </header>

      <button type="button" id="btn-reopen-desktop" class="btn-reopen-desktop" aria-label="Abrir painel">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
      </button>

      <div id="map" role="application" aria-label="Mapa territorial"></div>

      <div class="map-controls">
        <button type="button" class="btn-control btn-search-map" data-open-search title="Pesquisar (Ctrl+K)">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"/><line x1="16.5" y1="16.5" x2="21" y2="21"/></svg>
          <span>Pesquisar</span>
        </button>
        <div class="map-mode-group" role="group" aria-label="Modo do mapa">
          <button type="button" id="btn-theme" class="map-mode map-mode-icon" aria-label="Alternar modo claro ou escuro"></button>
          <button type="button" class="map-mode active" data-mode="mapa" aria-label="Mapa"><svg class="mode-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><polygon points="1 6 1 22 8 18 16 22 23 18 23 2 16 6 8 2 1 6"/><line x1="8" y1="2" x2="8" y2="18"/><line x1="16" y1="6" x2="16" y2="22"/></svg><span class="mode-label">Mapa</span></button>
          <button type="button" class="map-mode" data-mode="satellite" aria-label="Satélite"><svg class="mode-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="10"/><line x1="2" y1="12" x2="22" y2="12"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg><span class="mode-label">Satélite</span></button>
        </div>
        <button type="button" id="btn-share" class="btn-control btn-share" title="Compartilhar">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><line x1="8.59" y1="13.51" x2="15.42" y2="17.49"/><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"/></svg>
          <span>Compartilhar</span>
        </button>
      </div>

      <button type="button" id="btn-rede-badge" class="rede-badge" aria-label="Abrir REDE"></button>

      <div id="map-legend" class="map-legend" aria-label="Legenda do mapa"></div>

      <button type="button" id="btn-show-map" class="btn-show-map" aria-label="Ver mapa" hidden>
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><polygon points="1 6 1 22 8 18 16 22 23 18 23 2 16 6 8 2 1 6"/><line x1="8" y1="2" x2="8" y2="18"/><line x1="16" y1="6" x2="16" y2="22"/></svg>
      </button>

      <button type="button" id="sheet-peek" class="sheet-peek" aria-label="Expandir painel de conteúdo">
        <span class="handle-bar"></span>
      </button>
    </main>
  </div>

  <div id="search-overlay" class="search-overlay" aria-hidden="true" role="dialog" aria-label="Pesquisar no mapa">
    <div class="search-panel">
      <div class="search-input-wrap">
        <svg class="search-input-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"/><line x1="16.5" y1="16.5" x2="21" y2="21"/></svg>
        <input type="search" id="search-input" class="search-input" placeholder="Território, quilombo, município, lugar…" autocomplete="off" enterkeyhint="search" aria-label="Termo de pesquisa">
        <button type="button" id="search-close" class="search-close" aria-label="Fechar pesquisa">×</button>
      </div>
      <p class="search-hint">Territórios · fichas REDE · pins no mapa · <kbd>/</kbd> ou <kbd>Ctrl+K</kbd></p>
      <div id="search-results" class="search-results"></div>
    </div>
  </div>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <div id="share-overlay" class="share-overlay" aria-hidden="true" role="dialog" aria-label="Compartilhar mapa">
    <div class="share-panel">
      <div class="share-panel-head">
        <h2 class="share-panel-title">Compartilhar mapa</h2>
        <button type="button" id="share-close" class="search-close" aria-label="Fechar">×</button>
      </div>
      <div class="share-body">
        <div class="share-section">
          <label class="share-label" for="share-url">Link desta vista</label>
          <div class="share-copy-row">
            <input type="text" id="share-url" class="share-input" readonly>
            <button type="button" id="share-copy-url" class="share-copy-btn">Copiar</button>
          </div>
        </div>
        <div class="share-section">
          <label class="share-label" for="share-embed">Incorporar em site (iframe)</label>
          <textarea id="share-embed" class="share-textarea" rows="4" readonly spellcheck="false"></textarea>
          <button type="button" id="share-copy-embed" class="share-copy-btn share-copy-block">Copiar código</button>
        </div>
        <button type="button" id="share-native" class="share-native-btn" hidden>Partilhar no dispositivo…</button>
        <p class="share-hint">A vista partilhada inclui território, ficha, município ou filtros activos. Mantenha o crédito <strong>MOVIMENTO IRUN · Casa de Castro Alves</strong>.</p>
      </div>
    </div>
  </div>

  <div id="lightbox" class="lightbox" aria-hidden="true" role="dialog" aria-label="Visualizar foto">
    <button type="button" class="lightbox-close" aria-label="Fechar">×</button>
    <button type="button" class="lightbox-prev" aria-label="Foto anterior">‹</button>
    <img class="lightbox-img" alt="">
    <button type="button" class="lightbox-next" aria-label="Próxima foto">›</button>
    <p class="lightbox-caption"></p>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
