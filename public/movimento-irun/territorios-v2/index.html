<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>MOVIMENTO IRUN — Mapa Identidade e Território</title>
  <meta property="og:title" content="MOVIMENTO IRUN — Mapa Identidade e Território">
  <meta property="og:description" content="Mapa participativo das comunidades quilombolas e territórios de identidade da Bahia — Curso Design de Território · Programa Bem Viver · Casa de Castro Alves.">
  <meta property="og:image" content="https://casadecastroalves.com.br/movimento-irun/territorios/assets/og-mapa-bahia.png">
  <meta property="og:url" content="https://casadecastroalves.com.br/movimento-irun/territorios-v2/">
  <meta property="og:type" content="website">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --yellow: #F5C800;
      --amber: #d97706;
      --text: #1a1a1a;
      --text-muted: #6b7280;
      --white: #ffffff;
      --shadow-lg: 0 20px 60px rgba(0,0,0,0.18);
    }

    html, body { height: 100%; overflow: hidden; font-family: Arial, sans-serif; }
    #map { position: absolute; inset: 0; }

    /* ── PANEL ── */
    .panel {
      position: absolute; top: 16px; left: 16px;
      width: 360px; max-height: calc(100vh - 32px);
      background: rgba(255,255,255,0.97);
      backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
      border-radius: 20px; box-shadow: var(--shadow-lg);
      border: 1px solid rgba(255,255,255,0.5);
      z-index: 10; display: flex; flex-direction: column; overflow: hidden;
    }

    /* ── HEADER ── */
    .panel-header {
      background: transparent; color: var(--text);
      padding: 14px 18px 12px; flex-shrink: 0;
      border-bottom: 1px solid #f1f5f9;
    }
    .header-top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
    .header-tag {
      font-size: 0.58rem; font-family: monospace; letter-spacing: 0.15em; text-transform: uppercase;
      background: rgba(245,200,0,0.15); border: 1px solid rgba(245,200,0,0.35);
      color: #92400e; padding: 3px 9px; border-radius: 20px; font-weight: 700;
    }
    .header-controls { display: flex; gap: 4px; }
    .header-btn {
      background: transparent; border: none; cursor: pointer;
      color: var(--text-muted); padding: 6px; border-radius: 8px;
      transition: background 0.15s, color 0.15s; display: flex; align-items: center;
    }
    .header-btn:hover { background: #f1f5f9; color: var(--text); }
    .header-btn.locating { color: #2563eb; animation: pulse-btn 1s infinite; }
    @keyframes pulse-btn { 0%,100%{opacity:1} 50%{opacity:0.4} }
    .header-btn svg { width: 16px; height: 16px; }
    .header-brand { cursor: pointer; display: inline-block; }
    .header-brand:hover .header-title { text-decoration: underline; text-decoration-color: var(--yellow); }
    .header-title { font-size: 1rem; font-weight: 700; letter-spacing: 0.06em; color: var(--text); }
    .header-sub {
      font-size: 0.62rem; color: var(--text-muted); letter-spacing: 0.08em;
      margin-top: 1px; font-weight: 500; text-transform: none;
    }

    /* ── SEARCH ── */
    .search-wrap { padding: 10px 14px; border-bottom: 1px solid #f1f5f9; flex-shrink: 0; }
    .search-inner {
      display: flex; align-items: center; gap: 8px;
      background: #f8fafc; border: 1px solid #e2e8f0;
      border-radius: 12px; padding: 9px 12px;
      transition: border-color 0.15s, box-shadow 0.15s;
    }
    .search-inner:focus-within { border-color: var(--amber); box-shadow: 0 0 0 3px rgba(217,119,6,0.1); }
    .search-inner svg { color: #94a3b8; flex-shrink: 0; width: 14px; height: 14px; }
    .search-inner input { border: none; background: transparent; outline: none; width: 100%; font-size: 0.8rem; color: var(--text); }
    .search-inner input::placeholder { color: #94a3b8; }
    .search-shortcut { font-size: 0.6rem; background: #e2e8f0; padding: 2px 6px; border-radius: 4px; color: var(--text-muted); font-family: monospace; flex-shrink: 0; }
    .search-clear { background: none; border: none; cursor: pointer; color: #94a3b8; padding: 2px; border-radius: 50%; transition: all 0.1s; display: flex; align-items: center; }
    .search-clear:hover { background: #e2e8f0; color: var(--text); }
    .search-clear svg { width: 13px; height: 13px; }

    /* ── FILTERS ── */
    .filters {
      display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none;
      padding: 8px 14px; border-bottom: 1px solid #f1f5f9; flex-shrink: 0;
    }
    .filters::-webkit-scrollbar { display: none; }
    .filter-pill {
      display: flex; align-items: center; gap: 5px; padding: 6px 12px;
      border-radius: 20px; font-size: 0.68rem; font-weight: 600; cursor: pointer;
      white-space: nowrap; border: 1px solid #e2e8f0; background: white;
      color: var(--text-muted); transition: all 0.15s;
    }
    .filter-pill:hover { border-color: #94a3b8; color: var(--text); }
    .fp-ti    { background: #0f172a; color: white; border-color: #0f172a; }
    .fp-rede  { background: #92400e; color: white; border-color: #92400e; }
    .fp-teia  { background: #5b21b6; color: white; border-color: #5b21b6; }
    .fp-pc    { background: #15803d; color: white; border-color: #15803d; }
    .filter-dot { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; }

    /* ── LIST ── */
    .panel-body { flex: 1; overflow-y: auto; overscroll-behavior: contain; padding: 10px; }

    /* ── ABOUT (info do mapa) ── */
    .about-wrap { padding: 14px 4px 4px; }
    .about-heading { font-size: 0.9rem; font-weight: 700; color: var(--text); margin-bottom: 10px; }
    .about-p { font-size: 0.76rem; color: var(--text-muted); line-height: 1.65; margin-bottom: 8px; }
    .about-link {
      display: inline-flex; align-items: center; gap: 6px;
      font-size: 0.72rem; font-weight: 600; color: #92400e;
      background: rgba(245,200,0,0.12); border: 1px solid rgba(245,200,0,0.3);
      padding: 7px 14px; border-radius: 20px; margin-top: 8px;
      text-decoration: none; transition: background 0.15s;
    }
    .about-link:hover { background: rgba(245,200,0,0.22); }
    .about-secao-title { font-size: 0.78rem; font-weight: 700; color: var(--text); margin: 14px 0 4px; }
    .about-credits {
      margin-top: 18px; padding-top: 12px; border-top: 1px solid #f1f5f9;
      font-size: 0.62rem; color: #94a3b8; font-family: monospace;
      letter-spacing: 0.08em; text-transform: uppercase; line-height: 1.8;
    }

    /* ── CARD ── */
    .ti-card {
      position: relative; overflow: hidden; background: white;
      border: 1px solid #e2e8f0; border-radius: 14px;
      padding: 13px 13px 11px 17px; cursor: pointer; margin-bottom: 7px;
      transition: border-color 0.15s, box-shadow 0.15s;
    }
    .ti-card:last-child { margin-bottom: 0; }
    .ti-card:hover { border-color: #cbd5e1; box-shadow: 0 4px 16px rgba(0,0,0,0.06); }
    .ti-card.active { background: rgba(245,200,0,0.05); border-color: var(--yellow); box-shadow: 0 4px 16px rgba(245,200,0,0.14); }
    .ti-card-bar { position: absolute; top: 0; left: 0; bottom: 0; width: 4px; border-radius: 14px 0 0 14px; }
    .bar-rede  { background: var(--yellow); }
    .bar-teia  { background: #7c3aed; }
    .bar-pc    { background: #15803d; }
    .bar-sem   { background: #cbd5e1; }
    .ti-card-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 8px; }
    .ti-card-num {
      font-size: 0.62rem; font-family: monospace; font-weight: 700;
      background: #f1f5f9; color: var(--text-muted);
      padding: 2px 6px; border-radius: 5px; flex-shrink: 0; margin-top: 1px;
    }
    .ti-card.active .ti-card-num { background: rgba(245,200,0,0.2); color: #92400e; }
    .ti-card-name { font-size: 0.83rem; font-weight: 700; color: var(--text); line-height: 1.3; flex: 1; }
    .ti-rede-tag {
      font-size: 0.58rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em;
      color: #92400e; background: rgba(245,200,0,0.15); border: 1px solid rgba(245,200,0,0.3);
      padding: 2px 7px; border-radius: 10px; flex-shrink: 0;
    }
    .ti-teia-tag {
      font-size: 0.58rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em;
      color: #5b21b6; background: #f5f3ff; border: 1px solid #ddd6fe;
      padding: 2px 7px; border-radius: 10px; flex-shrink: 0;
    }
    .ti-pc-tag {
      font-size: 0.58rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em;
      color: #15803d; background: #f0fdf4; border: 1px solid #bbf7d0;
      padding: 2px 7px; border-radius: 10px; flex-shrink: 0;
    }
    .ti-card-foot {
      display: flex; align-items: center; justify-content: space-between;
      margin-top: 6px; padding-top: 6px; border-top: 1px solid #f8fafc;
      font-size: 0.63rem; color: var(--text-muted); font-family: monospace;
    }
    .ti-card-arrow { color: #b45309; transition: transform 0.2s; }
    .ti-card:hover .ti-card-arrow { transform: translateX(3px); }

    /* ── EMPTY ── */
    .empty-state {
      padding: 40px 16px; text-align: center; color: var(--text-muted);
      display: flex; flex-direction: column; align-items: center; gap: 10px;
    }
    .empty-state svg { width: 36px; height: 36px; color: #e2e8f0; }
    .empty-state p { font-size: 0.82rem; font-weight: 600; }
    .empty-state small { font-size: 0.72rem; max-width: 200px; line-height: 1.5; }

    /* ── DETAIL PANEL ── */
    .detail-panel {
      position: absolute; top: 16px; right: 16px;
      width: 360px; max-height: calc(100vh - 32px);
      background: rgba(255,255,255,0.97);
      backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
      border-radius: 20px; box-shadow: var(--shadow-lg);
      border: 1px solid rgba(255,255,255,0.5);
      z-index: 10; display: flex; flex-direction: column; overflow: hidden;
      transform: translateX(110%);
      transition: transform 0.4s cubic-bezier(0.34,1.4,0.64,1);
    }
    .detail-panel.visible { transform: translateX(0); }

    /* Header com foto */
    .detail-img-wrap { height: 160px; position: relative; background: #f1f5f9; flex-shrink: 0; overflow: hidden; }
    .detail-img-wrap img { width: 100%; height: 100%; object-fit: cover; }
    .detail-overlay {
      position: absolute; inset: 0;
      background: linear-gradient(to top, rgba(0,0,0,0.75) 0%, rgba(0,0,0,0.2) 50%, transparent 100%);
      display: flex; flex-direction: column; justify-content: flex-end; padding: 16px;
    }
    /* Header sem foto (TI sem imagem) */
    .detail-text-header {
      padding: 20px 20px 16px; background: white; flex-shrink: 0;
      border-bottom: 1px solid #f1f5f9; position: relative;
    }
    .detail-close {
      position: absolute; top: 10px; right: 10px;
      background: rgba(0,0,0,0.07); border: none; cursor: pointer;
      color: #374151; border-radius: 50%; padding: 6px;
      transition: background 0.15s; display: flex; align-items: center;
    }
    .detail-close.on-photo { background: rgba(0,0,0,0.4); color: white; top: 10px; right: 10px; position: absolute; }
    .detail-close:hover { background: rgba(0,0,0,0.15); }
    .detail-close svg { width: 16px; height: 16px; }
    .detail-tag-img {
      font-size: 0.58rem; font-family: monospace; letter-spacing: 0.12em; text-transform: uppercase;
      font-weight: 700; padding: 3px 8px; border-radius: 12px; margin-bottom: 6px; display: inline-block;
    }
    .tag-rede  { background: rgba(245,200,0,0.22); border: 1px solid rgba(245,200,0,0.4); color: #92400e; }
    .tag-teia  { background: rgba(124,58,237,0.15); border: 1px solid rgba(124,58,237,0.3); color: #5b21b6; }
    .tag-pc    { background: rgba(21,128,61,0.12); border: 1px solid rgba(21,128,61,0.3); color: #15803d; }
    .tag-sem   { background: rgba(148,163,184,0.2); border: 1px solid rgba(148,163,184,0.3); color: #64748b; }
    .detail-name-img { font-size: 1.05rem; font-weight: 700; color: white; line-height: 1.2; }
    .detail-name-text { font-size: 1.05rem; font-weight: 700; color: var(--text); line-height: 1.2; padding-right: 28px; }

    .detail-body { flex: 1; overflow-y: auto; overscroll-behavior: contain; padding: 16px; }
    .detail-grid {
      display: grid; grid-template-columns: 1fr 1fr; gap: 10px;
      background: #f8fafc; padding: 12px; border-radius: 12px;
      border: 1px solid #f1f5f9; margin-bottom: 16px;
    }
    .dg-item > span:first-child {
      display: block; font-size: 0.58rem; font-family: monospace;
      text-transform: uppercase; letter-spacing: 0.1em; color: var(--text-muted); margin-bottom: 2px;
    }
    .dg-item > span:last-child { font-size: 0.8rem; font-weight: 600; color: var(--text); }
    .detail-section { margin-bottom: 14px; }
    .detail-section-title {
      display: flex; align-items: center; gap: 6px; font-size: 0.68rem;
      font-weight: 700; text-transform: uppercase; letter-spacing: 0.1em;
      color: var(--text); margin-bottom: 6px;
    }
    .detail-section-title svg { width: 13px; height: 13px; color: var(--amber); flex-shrink: 0; }
    .detail-section p { font-size: 0.77rem; color: var(--text-muted); line-height: 1.7; }

    /* ── LIGHTBOX ── */
    .lightbox {
      position: fixed; inset: 0; background: rgba(0,0,0,0.92);
      z-index: 100; display: flex; align-items: center; justify-content: center;
      opacity: 0; pointer-events: none; transition: opacity 0.2s;
    }
    .lightbox.open { opacity: 1; pointer-events: all; }
    .lightbox img { max-width: 92vw; max-height: 88vh; object-fit: contain; border-radius: 8px; }
    .lightbox-close {
      position: absolute; top: 16px; right: 16px;
      background: rgba(255,255,255,0.12); border: none; color: white;
      border-radius: 50%; padding: 10px; cursor: pointer; font-size: 1.2rem;
      display: flex; align-items: center; transition: background 0.15s;
    }
    .lightbox-close:hover { background: rgba(255,255,255,0.25); }
    .lightbox-caption {
      position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%);
      color: rgba(255,255,255,0.75); font-size: 0.75rem; text-align: center;
      max-width: 80vw; background: rgba(0,0,0,0.4); padding: 6px 16px; border-radius: 20px;
    }
    .lightbox-nav {
      position: absolute; top: 50%; transform: translateY(-50%);
      background: rgba(255,255,255,0.12); border: none; color: white;
      border-radius: 50%; padding: 12px; cursor: pointer; font-size: 1.2rem;
      transition: background 0.15s;
    }
    .lightbox-nav:hover { background: rgba(255,255,255,0.25); }
    .lightbox-prev { left: 16px; }
    .lightbox-next { right: 16px; }

    /* ── TOAST ── */
    .toast {
      position: fixed; bottom: 22px; left: 50%;
      transform: translateX(-50%) translateY(16px);
      background: #0f172a; color: white; padding: 11px 18px; border-radius: 14px;
      font-size: 0.76rem; display: flex; align-items: center; gap: 8px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.2); z-index: 50;
      opacity: 0; transition: opacity 0.2s, transform 0.2s; pointer-events: none;
    }
    .toast.visible { opacity: 1; transform: translateX(-50%) translateY(0); }
    .toast-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--yellow); flex-shrink: 0; }

    /* ── STYLE SWITCHER ── */
    .style-switcher {
      position: absolute; top: 16px; right: 72px; z-index: 10;
      display: flex; align-items: center; gap: 5px;
      background: rgba(255,255,255,0.97); backdrop-filter: blur(12px);
      padding: 5px 8px; border-radius: 12px;
      border: 1px solid #e2e8f0; box-shadow: 0 4px 20px rgba(0,0,0,0.08);
    }
    .style-btn {
      padding: 5px 10px; border-radius: 8px; font-size: 0.68rem; font-weight: 600;
      cursor: pointer; border: none; background: transparent; color: #64748b;
      transition: all 0.15s; white-space: nowrap;
    }
    .style-btn.active { background: #0f172a; color: white; }
    .style-btn:hover:not(.active) { background: #f1f5f9; color: var(--text); }
    .style-sep { width: 1px; height: 16px; background: #e2e8f0; }

    /* ── MapLibre ── */
    .maplibregl-ctrl-group { border-radius: 10px !important; overflow: hidden; box-shadow: 0 4px 16px rgba(0,0,0,0.08) !important; }
    .maplibregl-ctrl-attrib { font-size: 10px !important; }

    /* ── Dimensões (ficha) ── */
    .dimensoes { display: flex; flex-direction: column; gap: 6px; }
    .dim-item { background: #f8fafc; border: 1px solid #f1f5f9; border-radius: 10px; padding: 10px 14px; }
    .dim-item summary {
      cursor: pointer; font-weight: 600; font-size: 0.78rem; color: var(--text);
      list-style: none; display: flex; align-items: center; gap: 6px;
    }
    .dim-item summary::before {
      content: '+'; color: var(--amber); font-weight: 700; font-size: 0.95rem;
      transition: transform 0.15s; display: inline-block; width: 12px;
    }
    .dim-item[open] summary::before { content: '−'; }
    .dim-item p { margin-top: 8px; font-size: 0.75rem; line-height: 1.6; color: var(--text-muted); font-weight: 300; }

    /* ── Galeria de fotos ── */
    .ficha-fotos { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }
    .ficha-fotos figure {
      margin: 0; border-radius: 10px; overflow: hidden;
      background: #f1f5f9; position: relative; aspect-ratio: 4/3;
      cursor: pointer; transition: transform 0.15s;
    }
    .ficha-fotos figure:hover { transform: scale(1.03); }
    .ficha-fotos img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .ficha-fotos figcaption {
      position: absolute; bottom: 0; left: 0; right: 0;
      background: linear-gradient(to top, rgba(0,0,0,0.7), transparent);
      color: white; font-size: 0.65rem; padding: 14px 8px 6px;
      opacity: 0; transition: opacity 0.15s;
    }
    .ficha-fotos figure:hover figcaption { opacity: 1; }

    .ficha-videos { display: flex; flex-direction: column; gap: 14px; }
    .video-embed iframe {
      width: 100%; aspect-ratio: 16/9; border: none;
      border-radius: 10px; background: #000;
    }
    .video-title { margin-top: 6px; font-size: 0.72rem; color: var(--text-muted); font-weight: 500; }

    .ficha-list-mini { display: flex; flex-direction: column; gap: 6px; }
    .ficha-mini {
      text-align: left; background: white; border: 1px solid #e2e8f0;
      border-radius: 10px; padding: 10px 12px; cursor: pointer;
      transition: border-color 0.15s, background 0.15s;
    }
    .ficha-mini:hover { border-color: var(--amber); background: #fef3c7; }
    .ficha-mini strong { display: block; font-size: 0.78rem; color: var(--text); margin-bottom: 2px; }
    .ficha-mini span { display: block; font-size: 0.7rem; color: var(--text-muted); }

    /* ── Pins ── */
    .irun-pin {
      cursor: pointer; width: 26px; height: 26px;
      transition: transform 0.15s, filter 0.15s;
      filter: drop-shadow(0 2px 4px rgba(0,0,0,0.3));
    }
    .irun-pin svg { width: 100%; height: 100%; }
    .irun-pin:hover { transform: scale(1.3) translateY(-3px); z-index: 5; }
    /* REDE IRUN: amarelo */
    .pin-rede { color: #F5C800; width: 30px; height: 30px; }
    /* Teia dos Povos: roxo */
    .pin-teia { color: #7c3aed; width: 26px; height: 26px; }
    /* Ponto de Cultura: verde */
    .pin-pc { color: #15803d; width: 26px; height: 26px; }
    /* Ponto extra simples: slate */
    .pin-extra { color: #64748b; width: 20px; height: 20px; }

    /* ── Popup do mapa (preview com fotos/vídeos) ── */
    .irun-popup .maplibregl-popup-content {
      padding: 0; border-radius: 16px; overflow: hidden;
      box-shadow: 0 20px 60px rgba(0,0,0,0.25);
      min-width: 260px; max-width: 300px; border: none;
    }
    .irun-popup .maplibregl-popup-close-button {
      color: white; font-size: 1.1rem; font-weight: 700;
      width: 28px; height: 28px; display: flex; align-items: center; justify-content: center;
      background: rgba(0,0,0,0.35); border-radius: 50%; top: 8px; right: 8px;
      text-shadow: none; line-height: 1; transition: background 0.15s;
    }
    .irun-popup .maplibregl-popup-close-button:hover { background: rgba(0,0,0,0.6); }
    .irun-popup .maplibregl-popup-tip { border-top-color: white; }
    .pop-img { width: 100%; height: 148px; object-fit: cover; display: block; }
    .pop-no-img {
      height: 56px; background: linear-gradient(135deg,#0f172a,#1e293b);
      display: flex; align-items: center; padding: 0 14px;
      font-size: 0.65rem; font-family: monospace; letter-spacing: 0.15em;
      color: rgba(255,255,255,0.4); text-transform: uppercase;
    }
    .pop-grid { display: grid; grid-template-columns: repeat(3,1fr); gap: 2px; }
    .pop-grid img { width: 100%; aspect-ratio: 1; object-fit: cover; display: block; cursor: zoom-in; }
    .pop-body { padding: 12px 14px 14px; }
    .pop-tag { font-size: 0.56rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em; padding: 2px 8px; border-radius: 10px; display: inline-block; margin-bottom: 6px; }
    .pop-name { font-size: 0.9rem; font-weight: 700; color: var(--text); line-height: 1.25; margin-bottom: 2px; }
    .pop-sub  { font-size: 0.68rem; color: var(--text-muted); margin-bottom: 10px; }
    .pop-videos { display: flex; flex-direction: column; gap: 8px; margin-bottom: 10px; }
    .pop-video-wrap { border-radius: 10px; overflow: hidden; background: #000; }
    .pop-video-wrap iframe { width: 100%; aspect-ratio: 16/9; border: none; display: block; }
    .pop-vtitle { font-size: 0.65rem; color: var(--text-muted); margin-top: 4px; font-style: italic; }
    .pop-open {
      width: 100%; padding: 9px 12px; border-radius: 10px; border: none;
      background: var(--yellow); color: #1a1a1a; font-weight: 700; font-size: 0.75rem;
      cursor: pointer; margin-top: 4px; transition: background 0.15s; letter-spacing: 0.02em;
    }
    .pop-open:hover { background: #e6b800; }

    /* Handle só aparece no mobile */
    .panel-handle-area { display: none; }

    /* Peek = abinha flutuante para reabrir o painel */
    .sheet-peek {
      display: none; position: fixed;
      bottom: 16px; left: 50%; transform: translateX(-50%);
      background: rgba(255,255,255,0.96); backdrop-filter: blur(10px);
      border: 1px solid #e2e8f0; border-radius: 24px;
      padding: 10px 28px; box-shadow: 0 6px 24px rgba(0,0,0,0.15);
      cursor: pointer; z-index: 20;
      animation: peek-in 0.25s ease-out;
    }
    @keyframes peek-in {
      from { opacity: 0; transform: translateX(-50%) translateY(20px); }
      to   { opacity: 1; transform: translateX(-50%) translateY(0); }
    }
    .sheet-peek .peek-bar { display: block; width: 42px; height: 5px; background: #94a3b8; border-radius: 3px; }
    .sheet-peek.visible { display: block; }

    /* ── Mobile ── */
    @media (max-width: 768px) {
      .panel {
        top: auto; bottom: 0; left: 0; right: 0; width: 100%;
        border-radius: 20px 20px 0 0; border-bottom: none;
        /* Mostra ~55% da tela, mapa visível acima */
        height: 57vh; max-height: 57vh;
        will-change: transform;
        transition: transform 0.25s cubic-bezier(0.4,0,0.2,1);
      }
      .panel.dragging { transition: none; }
      .panel-handle-area {
        display: flex; padding: 10px 0 6px;
        cursor: grab; touch-action: none; flex-shrink: 0;
        justify-content: center; background: rgba(255,255,255,0.96);
      }
      .panel-handle-area:active { cursor: grabbing; }
      .panel-handle-bar {
        width: 42px; height: 5px; background: #cbd5e1; border-radius: 3px;
        transition: background 0.15s;
      }
      .panel-handle-area:hover .panel-handle-bar { background: #94a3b8; }
      .detail-panel {
        top: auto; bottom: 0; right: 0; left: 0; width: 100%;
        border-radius: 20px 20px 0 0; border-bottom: none;
        /* Ficha ocupa ~65vh: mapa visível nos 35% acima */
        max-height: 65vh;
        transform: translateY(110%);
      }
      .detail-panel.visible { transform: translateY(0); }
      .style-switcher {
        /* No mobile: posição inferior, acima do peek */
        top: auto; right: auto;
        bottom: 58vh; left: 50%; transform: translateX(-50%);
        font-size: 0.6rem;
      }
    }
  </style>
</head>
<body>

<div id="map"></div>

<!-- Lightbox para galeria fullscreen -->
<div class="lightbox" id="lightbox">
  <button class="lightbox-close" id="lb-close">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
  </button>
  <button class="lightbox-nav lightbox-prev" id="lb-prev">&#8249;</button>
  <img id="lb-img" src="" alt="">
  <button class="lightbox-nav lightbox-next" id="lb-next">&#8250;</button>
  <div class="lightbox-caption" id="lb-cap"></div>
</div>

<div class="style-switcher">
  <button class="style-btn active" data-style="positron">Normal</button>
  <div class="style-sep"></div>
  <button class="style-btn" data-style="voyager">Colorido</button>
  <div class="style-sep"></div>
  <button class="style-btn" data-style="satellite">Satélite</button>
</div>

<div class="panel" id="panel">
  <div class="panel-handle-area" id="panel-handle">
    <div class="panel-handle-bar"></div>
  </div>
  <div class="panel-header">
    <div class="header-top">
      <span class="header-tag">REDE IRUN</span>
      <div class="header-controls">
        <button class="header-btn" id="btn-locate" title="Minha localização">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
            <circle cx="12" cy="12" r="3"/><line x1="12" y1="2" x2="12" y2="5"/>
            <line x1="12" y1="19" x2="12" y2="22"/><line x1="2" y1="12" x2="5" y2="12"/>
            <line x1="19" y1="12" x2="22" y2="12"/>
          </svg>
        </button>
        <button class="header-btn" id="btn-reset" title="Ver toda a Bahia">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
            <circle cx="12" cy="12" r="10"/>
            <polygon points="16.24 7.76 14.12 14.12 7.76 16.24 9.88 9.88 16.24 7.76"/>
          </svg>
        </button>
      </div>
    </div>
    <div class="header-brand" id="btn-about" title="Sobre o Mapa">
      <h1 class="header-title">MOVIMENTO IRUN</h1>
      <p class="header-sub">Design de Território · Programa Bem Viver</p>
    </div>
  </div>

  <div class="search-wrap">
    <div class="search-inner">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
        <circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/>
      </svg>
      <input type="text" id="search" placeholder="Buscar território, comunidade, município…" aria-label="Pesquisar">
      <span class="search-shortcut" id="kb-hint" style="display:none">Ctrl+K</span>
      <button class="search-clear" id="search-clear" style="display:none">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
          <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
        </svg>
      </button>
    </div>
  </div>

  <div class="filters">
    <button class="filter-pill fp-ti" data-filter="ti">TI</button>
    <button class="filter-pill" data-filter="rede">
      <span class="filter-dot" style="background:#F5C800"></span>REDE IRUN
    </button>
    <button class="filter-pill" data-filter="teia">
      <span class="filter-dot" style="background:#7c3aed"></span>Teia dos Povos
    </button>
    <button class="filter-pill" data-filter="pc">
      <span class="filter-dot" style="background:#15803d"></span>Pontos de Cultura
    </button>
  </div>

  <div class="panel-body" id="panel-body"></div>
</div>

<!-- Detail panel (TI ou Ficha) -->
<div class="detail-panel" id="detail-panel">
  <!-- Preenchido dinamicamente por JS -->
</div>

<button class="sheet-peek" id="sheet-peek" aria-label="Abrir painel">
  <span class="peek-bar"></span>
</button>

<div class="toast" id="toast">
  <span class="toast-dot"></span>
  <span id="toast-msg"></span>
</div>

<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<script>
(function () {
  const PROD_BASE   = '../territorios/';
  const DATA_BASE   = PROD_BASE + 'data/';
  const FICHA_BASE  = PROD_BASE + 'data/fichas/';
  const PONTOS_BASE = PROD_BASE + 'data/pontos/';
  const ASSETS_BASE = PROD_BASE + 'assets/';
  const GEO_URL     = PROD_BASE + 'geo/base/territorios.geojson';

  const STYLES = {
    positron:  'https://basemaps.cartocdn.com/gl/positron-gl-style/style.json',
    voyager:   'https://basemaps.cartocdn.com/gl/voyager-gl-style/style.json',
    dark:      'https://basemaps.cartocdn.com/gl/dark-matter-gl-style/style.json',
    satellite: 'https://api.maptiler.com/maps/satellite/style.json?key=get_your_own_OpIi9ZULNHzrESv6T2vL',
  };
  /* Satélite gratuito via ESRI sem API key */
  const SATELLITE_TILES = {
    version: 8,
    sources: { esri: {
      type: 'raster',
      tiles: ['https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}'],
      tileSize: 256, attribution: '© Esri, Maxar, Earthstar Geographics',
    }},
    layers: [{ id: 'esri-satellite', type: 'raster', source: 'esri' }],
  };

  const BAHIA = { center: [-39.5, -13.2], zoom: 7.2 };

  let allFeatures  = [];
  let territorios  = [];
  let fichas       = [];
  let fichasById   = {};
  let pontosByTi   = {};
  let redeStats    = {};
  let pinMarkers   = [];
  let hoveredId    = null;
  let activeId     = null;
  let activeFicha  = null;
  let activeFilter = 'ti';
  let query        = '';
  let locating     = false;
  let userMarker   = null;
  let toastTimer   = null;
  let lbPhotos     = [];
  let lbIdx        = 0;
  let configData   = null;

  const map = new maplibregl.Map({
    container: 'map',
    style: STYLES.positron,
    center: BAHIA.center, zoom: BAHIA.zoom,
    minZoom: 4, maxZoom: 18,
  });
  map.addControl(new maplibregl.NavigationControl({ showCompass: true }), 'top-right');

  /* ── Lightbox ── */
  const lb      = document.getElementById('lightbox');
  const lbImg   = document.getElementById('lb-img');
  const lbCap   = document.getElementById('lb-cap');
  document.getElementById('lb-close').addEventListener('click', () => lb.classList.remove('open'));
  document.getElementById('lb-prev').addEventListener('click', () => lbNav(-1));
  document.getElementById('lb-next').addEventListener('click', () => lbNav(+1));
  lb.addEventListener('click', e => { if (e.target === lb) lb.classList.remove('open'); });
  document.addEventListener('keydown', e => {
    if (!lb.classList.contains('open')) return;
    if (e.key === 'Escape') lb.classList.remove('open');
    if (e.key === 'ArrowLeft') lbNav(-1);
    if (e.key === 'ArrowRight') lbNav(+1);
  });
  function openLightbox(photos, idx) {
    lbPhotos = photos; lbIdx = idx;
    lbShow();
    lb.classList.add('open');
  }
  function lbNav(dir) {
    lbIdx = (lbIdx + dir + lbPhotos.length) % lbPhotos.length;
    lbShow();
  }
  function lbShow() {
    const p = lbPhotos[lbIdx];
    lbImg.src = p.src; lbCap.textContent = p.cap || '';
    document.getElementById('lb-prev').style.display = lbPhotos.length > 1 ? '' : 'none';
    document.getElementById('lb-next').style.display = lbPhotos.length > 1 ? '' : 'none';
  }

  async function fetchJSON(url, label) {
    const r = await fetch(url);
    if (!r.ok) throw new Error(`${label} → HTTP ${r.status}`);
    return r.json();
  }

  map.on('load', async () => {
    try {
      const [geo, manifest, tisData, cfg] = await Promise.all([
        fetchJSON(GEO_URL, 'GeoJSON'),
        fetchJSON(DATA_BASE + 'manifest.json', 'manifest'),
        fetchJSON(DATA_BASE + 'territorios.json', 'territorios'),
        fetchJSON(DATA_BASE + 'config.json', 'config').catch(() => null),
      ]);
      configData = cfg;

      geo.features.forEach((f, i) => { f.id = i; });
      allFeatures = geo.features;
      territorios = tisData.territorios || [];

      const [fichasArr, pontosArr] = await Promise.all([
        Promise.all((manifest.fichas || []).map(id =>
          fetch(FICHA_BASE + id + '.json').then(r => r.json()).catch(() => null)
        )),
        Promise.all((manifest.pontos || []).map(tiId =>
          fetch(PONTOS_BASE + tiId + '.json').then(r => r.json()).catch(() => null)
        )),
      ]);

      fichas = fichasArr.filter(Boolean);
      fichas.forEach(f => { fichasById[f.id] = f; });

      pontosArr.filter(Boolean).forEach(p => {
        pontosByTi[p.territorioId] = p.pontos || [];
      });

      fichas.forEach(f => {
        if (!f.rede) return;
        const t = f.territorioId;
        if (!redeStats[t]) redeStats[t] = { fichas: 0, pontos: 0 };
        redeStats[t].fichas++;
      });
      Object.entries(pontosByTi).forEach(([tiId, pts]) => {
        if (!redeStats[tiId]) redeStats[tiId] = { fichas: 0, pontos: 0 };
        redeStats[tiId].pontos = pts.length;
      });
      territorios.forEach(t => { t.redeAtiva = !!redeStats[t.id]; });

      addLayers(geo);
      wireMap();
      addPins();
      renderList();
      wireSearch();
      wireFilters();
      wireStyles();
      wireControls();

      if (window.matchMedia('(pointer: fine)').matches)
        document.getElementById('kb-hint').style.display = 'block';

    } catch (e) {
      console.error('[IRUN] Erro:', e);
      document.getElementById('panel-body').innerHTML = `<div class="empty-state">
        <p style="color:#dc2626"><strong>Erro ao carregar:</strong></p>
        <small>${esc(String(e.message || e))}</small>
        <small style="margin-top:8px">Abra Console (F12) para detalhes</small>
      </div>`;
    }
  });

  /* ── Popup rico (fotos + vídeos no mapa) ── */
  function makePopupHtml(f) {
    const s = f.sidebar || {};
    const m = f.meta   || {};
    const fotos  = s.fotos  || [];
    const videos = (s.videos || []).filter(v => v.tipo === 'youtube' && v.id);

    const tagCls = f.rede ? 'tag-rede' : f.teiaDosPovos ? 'tag-teia' : f.pontoCultura ? 'tag-pc' : 'tag-sem';
    const tagTxt = f.rede ? 'REDE IRUN' : f.teiaDosPovos ? 'TEIA DOS POVOS' : f.pontoCultura ? 'PONTO DE CULTURA' : 'COMUNIDADE';

    const coverSrc = fotos[0]?.src
      ? ASSETS_BASE + fotos[0].src.replace(/^assets\//, '') : null;

    const coverHtml = coverSrc
      ? `<img class="pop-img" src="${esc(coverSrc)}" alt="${esc(m.nome||'')}">`
      : `<div class="pop-no-img">MOVIMENTO IRUN</div>`;

    const extras = fotos.slice(1, 4);
    const gridHtml = extras.length
      ? `<div class="pop-grid">${extras.map(p => {
          const src = ASSETS_BASE + (p.src||'').replace(/^assets\//, '');
          return `<img loading="lazy" src="${esc(src)}" alt="${esc(p.legenda||'')}">`;
        }).join('')}</div>` : '';

    const videosHtml = videos.length
      ? `<div class="pop-videos">${videos.map(v => `
          <div class="pop-video-wrap">
            <iframe
              src="https://www.youtube-nocookie.com/embed/${esc(v.id)}?rel=0&modestbranding=1&playsinline=1"
              loading="lazy"
              allow="accelerometer; autoplay; clipboard-write; encrypted-media; picture-in-picture; fullscreen"
              allowfullscreen></iframe>
            ${v.titulo ? `<p class="pop-vtitle">${esc(v.titulo)}</p>` : ''}
          </div>`).join('')}
        </div>` : '';

    return `<div class="pop-card">
      ${coverHtml}
      ${gridHtml}
      <div class="pop-body">
        <span class="pop-tag ${tagCls}">${tagTxt}</span>
        <h3 class="pop-name">${esc(m.nome||f.id)}</h3>
        <p class="pop-sub">${esc(f.tipo||'')}${m.municipio?' · '+esc(m.municipio):''}</p>
        ${videosHtml}
        <button class="pop-open" data-ficha="${esc(f.id)}">Ver ficha completa →</button>
      </div>
    </div>`;
  }

  /* ── Pins ── */
  function addPins() {
    pinMarkers.forEach(m => m.remove());
    pinMarkers = [];

    fichas.forEach(f => {
      const c = f.meta?.coords;
      if (!c) return;
      const [lat, lng] = c;
      let cls = 'irun-pin';
      if (f.rede) cls += ' pin-rede';
      else if (f.teiaDosPovos) cls += ' pin-teia';
      else if (f.pontoCultura) cls += ' pin-pc';
      addPin(lng, lat, { nome: f.meta?.nome || f.id, fichaId: f.id, cls });
    });

    const fichaCoords = new Set(fichas
      .filter(f => f.meta?.coords)
      .map(f => f.meta.coords.map(v => v.toFixed(4)).join(','))
    );

    Object.values(pontosByTi).flat().forEach(p => {
      if (!p.coords) return;
      const [lat, lng] = p.coords;
      const key = [lat, lng].map(v => Number(v).toFixed(4)).join(',');
      if (fichaCoords.has(key)) return;
      const fichaRef = (p.fichaId || p.entidadeId) ? fichasById[p.fichaId || p.entidadeId] : null;
      if (fichaRef?.meta?.coords) {
        const [flat, flng] = fichaRef.meta.coords;
        if (Math.abs(flat - lat) < 0.0002 && Math.abs(flng - lng) < 0.0002) return;
      }
      addPin(lng, lat, {
        nome: p.nome,
        fichaId: p.fichaId || p.entidadeId || null,
        cls: 'irun-pin pin-extra',
      });
    });
  }

  function addPin(lng, lat, info) {
    const el = document.createElement('div');
    el.className = info.cls || 'irun-pin';
    el.title = info.nome;
    el.innerHTML = `<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2c-3.87 0-7 3.13-7 7 0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5a2.5 2.5 0 110-5 2.5 2.5 0 010 5z"/></svg>`;

    const f = info.fichaId ? fichasById[info.fichaId] : null;
    const hasMedia = f && ((f.sidebar?.fotos?.length || 0) + (f.sidebar?.videos?.filter(v=>v.tipo==='youtube'&&v.id).length||0)) > 0;

    if (hasMedia) {
      /* Popup rico com fotos e vídeos */
      const popup = new maplibregl.Popup({
        closeButton: true,
        maxWidth: '300px',
        className: 'irun-popup',
        offset: [0, -28],
        focusAfterOpen: false,
      }).setHTML(makePopupHtml(f));

      const marker = new maplibregl.Marker({ element: el, anchor: 'bottom' })
        .setLngLat([lng, lat])
        .setPopup(popup)
        .addTo(map);

      el.addEventListener('click', ev => { ev.stopPropagation(); marker.togglePopup(); });

      /* Botão "Ver ficha" dentro do popup */
      popup.on('open', () => {
        setTimeout(() => {
          const btn = document.querySelector(`.pop-open[data-ficha="${info.fichaId}"]`);
          if (btn) btn.addEventListener('click', () => { popup.remove(); openFicha(f); });
          /* Lightbox nas fotos do grid */
          const allFotos = (f.sidebar?.fotos||[]).map(p=>({
            src: ASSETS_BASE + (p.src||'').replace(/^assets\//,''), cap: p.legenda||'',
          }));
          document.querySelectorAll('.pop-grid img').forEach((img, i) =>
            img.addEventListener('click', () => openLightbox(allFotos, i + 1)));
        }, 50);
      });

      pinMarkers.push(marker);
    } else {
      /* Sem mídia: clique abre ficha ou toast */
      el.addEventListener('click', ev => {
        ev.stopPropagation();
        if (f) openFicha(f);
        else showToast(info.nome);
      });
      pinMarkers.push(new maplibregl.Marker({ element: el, anchor: 'bottom' }).setLngLat([lng, lat]).addTo(map));
    }
  }

  function addLayers(geo) {
    if (!map.getSource('ti'))
      map.addSource('ti', { type: 'geojson', data: geo || { type:'FeatureCollection', features: allFeatures } });
    if (!map.getLayer('ti-fill'))
      map.addLayer({ id: 'ti-fill', type: 'fill', source: 'ti', paint: {
        'fill-color': ['case',
          ['boolean',['feature-state','active'],false], 'rgba(245,200,0,0.35)',
          ['boolean',['feature-state','hover'], false], 'rgba(245,200,0,0.18)',
          'rgba(245,200,0,0.05)'],
      }});
    if (!map.getLayer('ti-line'))
      map.addLayer({ id: 'ti-line', type: 'line', source: 'ti', paint: {
        'line-color': '#F5C800',
        'line-width': ['case',['boolean',['feature-state','active'],false],2.5,1.2],
        'line-opacity': 0.85,
      }});
    if (!map.getLayer('ti-label'))
      map.addLayer({ id: 'ti-label', type: 'symbol', source: 'ti', layout: {
        'text-field': ['get','cod'],
        'text-size': ['interpolate',['linear'],['zoom'],5,9,8,13],
        'text-allow-overlap': false,
      }, paint: {
        'text-color': '#374151',
        'text-halo-color': 'rgba(255,255,255,0.85)', 'text-halo-width': 2,
      }});
  }

  function wireMap() {
    map.on('mousemove','ti-fill', e => {
      map.getCanvas().style.cursor = 'pointer';
      const id = e.features[0].id;
      if (hoveredId !== null && hoveredId !== id) map.setFeatureState({source:'ti',id:hoveredId},{hover:false});
      hoveredId = id;
      map.setFeatureState({source:'ti',id},{hover:true});
    });
    map.on('mouseleave','ti-fill', () => {
      map.getCanvas().style.cursor = '';
      if (hoveredId !== null) { map.setFeatureState({source:'ti',id:hoveredId},{hover:false}); hoveredId = null; }
    });
    map.on('click','ti-fill', e => {
      const full = allFeatures.find(x => x.id === e.features[0].id);
      if (full) selectTi(full);
    });
    map.on('click', e => {
      if (!map.queryRenderedFeatures(e.point,{layers:['ti-fill']}).length) deselect();
    });
  }

  function selectTi(feat) {
    if (activeId !== null) map.setFeatureState({source:'ti',id:activeId},{active:false});
    activeId = feat.id;
    map.setFeatureState({source:'ti',id:activeId},{active:true});
    showDetailTi(feat);
    fitFeature(feat);
    document.querySelectorAll('.ti-card').forEach(c =>
      c.classList.toggle('active', Number(c.dataset.fid) === feat.id));
  }

  function deselect() {
    if (activeId !== null) { map.setFeatureState({source:'ti',id:activeId},{active:false}); activeId = null; }
    document.getElementById('detail-panel').innerHTML = '';
    document.getElementById('detail-panel').classList.remove('visible');
    document.querySelectorAll('.ti-card').forEach(c => c.classList.remove('active'));
  }

  function getFiltered() {
    const q = query.toLowerCase();
    if (activeFilter === 'teia') {
      return fichas.filter(f => f.teiaDosPovos && (!q || matchFicha(f, q)));
    }
    if (activeFilter === 'pc') {
      return fichas.filter(f => f.pontoCultura && (!q || matchFicha(f, q)));
    }
    if (activeFilter === 'rede') {
      return allFeatures.filter(f => {
        const isRede = !!redeStats[f.properties.id];
        if (!isRede) return false;
        return !q || (f.properties.nome||'').toLowerCase().includes(q);
      });
    }
    /* ti: todos os territórios */
    return allFeatures.filter(f => {
      const nome = (f.properties.nome || '').toLowerCase();
      const cod  = String(f.properties.cod || '').toLowerCase();
      return !q || nome.includes(q) || cod.includes(q);
    });
  }

  function matchFicha(f, q) {
    return (f.meta?.nome||'').toLowerCase().includes(q) ||
           (f.meta?.municipio||'').toLowerCase().includes(q) ||
           (f.sidebar?.apresentacao||'').toLowerCase().includes(q);
  }

  function renderList() {
    const body = document.getElementById('panel-body');
    const list = getFiltered();

    if (!list.length) {
      body.innerHTML = `<div class="empty-state">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round">
          <circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/>
        </svg><p>Nenhum resultado</p>
        <small>Tente outros termos ou mude os filtros</small>
      </div>`;
      return;
    }

    /* Listas de fichas (teia / pontos de cultura) */
    if (activeFilter === 'teia' || activeFilter === 'pc') {
      const barCls = activeFilter === 'teia' ? 'bar-teia' : 'bar-pc';
      const tagFn  = f => activeFilter === 'teia'
        ? (f.rede ? '<span class="ti-rede-tag">REDE</span>' : '<span class="ti-teia-tag">TEIA</span>')
        : '<span class="ti-pc-tag">PC</span>';
      const sorted = [...list].sort((a,b) =>
        (a.meta?.nome||'').localeCompare(b.meta?.nome||'','pt-BR'));
      body.innerHTML = sorted.map(f => {
        const ti = territorios.find(t => t.id === f.territorioId);
        return `<div class="ti-card" data-fid="${esc(f.id)}" data-kind="ficha">
          <div class="ti-card-bar ${barCls}"></div>
          <div class="ti-card-top">
            <span class="ti-card-name">${esc(f.meta?.nome||f.id)}</span>
            ${tagFn(f)}
          </div>
          <div class="ti-card-foot">
            <span>${esc(f.tipo||'')} · ${esc(f.meta?.municipio||'')}${ti?' · TI '+ti.cod:''}</span>
            <span class="ti-card-arrow">Abrir →</span>
          </div>
        </div>`;
      }).join('');
      body.querySelectorAll('.ti-card').forEach(c =>
        c.addEventListener('click', () => { const f = fichasById[c.dataset.fid]; if (f) openFicha(f); }));
      return;
    }

    /* Listas de territórios (ti / rede) */
    const sorted = [...list].sort((a,b)=>(parseInt(a.properties.cod)||0)-(parseInt(b.properties.cod)||0));
    body.innerHTML = sorted.map(f => {
      const isRede = !!redeStats[f.properties.id];
      const info   = redeStats[f.properties.id] || {};
      return `<div class="ti-card${activeId===f.id?' active':''}" data-fid="${f.id}" data-kind="ti">
        <div class="ti-card-bar ${isRede?'bar-rede':'bar-sem'}"></div>
        <div class="ti-card-top">
          <span class="ti-card-num">${esc(f.properties.cod||'')}</span>
          <span class="ti-card-name">${esc(f.properties.nome||'—')}</span>
          ${isRede?'<span class="ti-rede-tag">REDE</span>':''}
        </div>
        <div class="ti-card-foot">
          <span>${isRede?`${info.fichas||0} fichas · ${info.pontos||0} pontos`:'Sem mapeamento'}</span>
          <span class="ti-card-arrow">Ver →</span>
        </div>
      </div>`;
    }).join('');
    body.querySelectorAll('.ti-card').forEach(c =>
      c.addEventListener('click', () => {
        const feat = allFeatures.find(f => f.id === Number(c.dataset.fid));
        if (feat) selectTi(feat);
      }));
  }

      return { src: ASSETS_BASE + foto.src.replace(/^assets\//,''), leg: foto.legenda || '' };

  function wireControls() {
    document.getElementById('btn-reset').addEventListener('click', () => {
      map.flyTo({center:BAHIA.center,zoom:BAHIA.zoom,duration:900}); deselect();
    });
    document.getElementById('btn-about').addEventListener('click', showAbout);
    document.getElementById('btn-locate').addEventListener('click', () => {
      if (!navigator.geolocation) { showToast('Geolocalização não suportada.'); return; }
      if (locating) return;
      locating = true;
      document.getElementById('btn-locate').classList.add('locating');
      showToast('Buscando localização…');
      navigator.geolocation.getCurrentPosition(
        pos => {
          locating = false; document.getElementById('btn-locate').classList.remove('locating');
          const {longitude,latitude} = pos.coords;
          showToast('Localização obtida!');
          map.flyTo({center:[longitude,latitude],zoom:10,duration:1500});
          if (userMarker) userMarker.remove();
          const el = document.createElement('div');
          el.style.cssText='width:16px;height:16px;background:#2563eb;border:3px solid white;border-radius:50%;box-shadow:0 0 0 5px rgba(37,99,235,0.22)';
          userMarker = new maplibregl.Marker({element:el}).setLngLat([longitude,latitude])
            .setPopup(new maplibregl.Popup({offset:12}).setHTML(
              `<div style="font-size:11px;padding:4px"><strong>Sua posição</strong></div>`
            )).addTo(map);
        },
        err => {
          locating=false; document.getElementById('btn-locate').classList.remove('locating');
          const m={1:'Permissão negada.',2:'Posição indisponível.',3:'Tempo esgotado.'};
          showToast(m[err.code]||'Erro de geolocalização.');
        },
        {enableHighAccuracy:true,timeout:10000}
      );
    });
  }

  function showToast(msg) {
    document.getElementById('toast-msg').textContent = msg;
    document.getElementById('toast').classList.add('visible');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(()=>document.getElementById('toast').classList.remove('visible'), 3500);
  }

  function fitFeature(f) {
    const pts=[];
    if (f.geometry.type==='Polygon') f.geometry.coordinates[0].forEach(p=>pts.push(p));
    else if (f.geometry.type==='MultiPolygon') f.geometry.coordinates.forEach(p=>p[0].forEach(c=>pts.push(c)));
    if (!pts.length) return;
    let [w,s,e,n]=[Infinity,Infinity,-Infinity,-Infinity];
    pts.forEach(([lng,lat])=>{if(lng<w)w=lng;if(lat<s)s=lat;if(lng>e)e=lng;if(lat>n)n=lat;});
    const mob = window.innerWidth<=768;
    map.fitBounds([[w,s],[e,n]],{padding:{top:mob?200:60,bottom:60,left:mob?60:400,right:mob?60:400},duration:700,maxZoom:9});
  }

  function closeSvg() {
    return `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>`;
  }

  function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}

  /* ── Free-drag bottom sheet (mobile) ── */
  (function initDrag(){
    const isMobile = () => window.innerWidth <= 768;
    const handle = document.getElementById('panel-handle');
    const panel  = document.getElementById('panel');
    const peek   = document.getElementById('sheet-peek');
    if (!handle || !panel) return;

    let startY=0, startOffset=0, dragging=false;
    const readOffset = () => { const m=new DOMMatrix(getComputedStyle(panel).transform); return isNaN(m.m42)?0:Math.max(0,m.m42); };
    const showPeek   = (show) => { if(peek) peek.classList.toggle('visible', show && isMobile()); };
    const closeSheet = () => { const h=panel.offsetHeight||Math.round(window.innerHeight*0.57); panel.style.transform=`translateY(${h}px)`; showPeek(true); };
    const openSheet  = () => { panel.style.transform='translateY(0)'; showPeek(false); };
    if (peek) peek.addEventListener('click', openSheet);

    const start=(e)=>{ if(!isMobile())return; dragging=true; startY=e.touches?e.touches[0].clientY:e.clientY; startOffset=readOffset(); panel.classList.add('dragging'); };
    const move =(e)=>{ if(!dragging)return; const y=e.touches?e.touches[0].clientY:e.clientY; panel.style.transform=`translateY(${Math.max(0,startOffset+(y-startY))}px)`; };
    const end  =(e)=>{ if(!dragging)return; dragging=false; panel.classList.remove('dragging'); const y=e.changedTouches?e.changedTouches[0].clientY:e.clientY; const off=Math.max(0,startOffset+(y-startY)); const h=panel.offsetHeight||Math.round(window.innerHeight*0.57); off>h*0.5?closeSheet():openSheet(); };

    handle.addEventListener('touchstart',start,{passive:true});
    window.addEventListener('touchmove',move,{passive:true});
    window.addEventListener('touchend',end);
    handle.addEventListener('mousedown',start);
    window.addEventListener('mousemove',move);
    window.addEventListener('mouseup',end);
    window.addEventListener('resize',()=>{ if(!isMobile()){panel.style.transform='';showPeek(false);} });
  })();
})();
</script>
</body>
</html>
