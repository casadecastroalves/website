              - { label: Programação, name: program, widget: list, field: { label: Item, name: p, widget: text } }
          - label: Edição VI
            name: VI
            widget: object
            fields:
              - { label: Descrição, name: desc, widget: list, field: { label: Parágrafo, name: p, widget: text } }
              - { label: Programação, name: program, widget: list, field: { label: Item, name: p, widget: text } }
          - label: Edição VII
            name: VII
            widget: object
            fields:
              - { label: Descrição, name: desc, widget: list, field: { label: Parágrafo, name: p, widget: text } }
              - { label: Programação, name: program, widget: list, field: { label: Item, name: p, widget: text } }
          - label: Edição VIII
            name: VIII
            widget: object
            fields:
              - { label: Descrição, name: desc, widget: list, field: { label: Parágrafo, name: p, widget: text } }
              - { label: Programação, name: program, widget: list, field: { label: Item, name: p, widget: text } }
          - label: Edição IX
            name: IX
            widget: object
            fields:
              - { label: Descrição, name: desc, widget: list, field: { label: Parágrafo, name: p, widget: text } }
              - { label: Programação, name: program, widget: list, field: { label: Item, name: p, widget: text } }
          - label: Edição X
